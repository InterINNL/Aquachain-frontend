<section id="social" class="innl-social">
  <div class="innl-social__accent" aria-hidden="true"></div>
  <div class="innl-social__inner">
    <span class="innl-social__badge">{{ social.badge }}</span>
    <h2>{{ social.title }}</h2>
    <p>{{ social.body }}</p>
    <a class="innl-social__cta" [href]="social.notifyHref"
      >{{ social.notifyLabel }}</a
    >
  </div>
</section>
