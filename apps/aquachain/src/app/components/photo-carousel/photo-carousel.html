<div class="ac-photo-carousel" role="group" aria-roledescription="carousel">
  @for (photo of photos(); track photo.src; let index = $index) {
    <img
      class="ac-photo-carousel__slide"
      [class.ac-photo-carousel__slide--active]="index === activeIndex()"
      [src]="photo.src"
      [alt]="photo.alt"
      [style.object-position]="photo.objectPosition ?? 'center'"
      width="400"
      height="220"
      loading="lazy"
      [attr.aria-hidden]="index === activeIndex() ? null : true"
    />
  }
  @if (photos().length > 1) {
    <div class="ac-photo-carousel__dots" aria-hidden="true">
      @for (photo of photos(); track photo.src; let index = $index) {
        <button
          type="button"
          class="ac-photo-carousel__dot"
          [class.ac-photo-carousel__dot--active]="index === activeIndex()"
          (click)="selectSlide(index); $event.preventDefault(); $event.stopPropagation()"
        ></button>
      }
    </div>
  }
</div>
