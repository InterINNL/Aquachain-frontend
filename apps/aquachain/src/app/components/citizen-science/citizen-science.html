<div class="module-header bg-info text-white py-4">
  <div class="container">
    <h1>
      <fa-icon [icon]="['fas', 'microscope']" class="me-2"></fa-icon>
      Citizen Science
    </h1>
    <p class="lead mb-0">
      Monitor water quality and quantity to earn rewards for verified data
    </p>
  </div>
</div>
<div class="container py-4">
  <ul class="nav nav-tabs mb-4">
    <li class="nav-item" *ngFor="let tab of tabs; let i = index">
      <button
        class="nav-link"
        [class.active]="activeTab === i"
        (click)="setActiveTab(i)"
      >
        <fa-icon [icon]="tab.icon" class="me-2"></fa-icon>
        {{ tab.label }}
      </button>
    </li>
  </ul>
  <div class="sensors-tab">
    <div class="row mb-4">
      <div class="col-12">
        <div class="card">
          <div
            class="card-header d-flex justify-content-between align-items-center"
          >
            <h5 class="mb-0">Your Sensors</h5>
            <button class="btn btn-primary" (click)="setRegisterNewSensor()">
              <i class="bi bi-plus-circle me-1"></i> Register New Sensor
            </button>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Model</th>
                    <th>Location</th>
                    <th>Registration Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>1</td>
                    <td>WaterQuality</td>
                    <td>AquaTest Pro</td>
                    <td>River North</td>
                    <td>May 1, 2025</td>
                    <td><span class="badge bg-success">Active</span></td>
                    <td>
                      <div class="btn-group btn-group-sm">
                        <button
                          class="btn btn-outline-primary"
                          (click)="setView()"
                        >
                          View</button
                        ><button
                          class="btn btn-outline-success"
                          (click)="setSubmitData()"
                        >
                          Submit Data
                        </button>
                        <button
                          class="btn btn-outline-secondary"
                          (click)="activate()"
                        >
                          Activate
                        </button>
                        <button
                          class="btn btn-outline-secondary"
                          (click)="deactivate()"
                        >
                          Deactivate
                        </button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5 class="mb-0" [ngSwitch]="mode">
              <span *ngSwitchCase="'register'">Register New Sensor</span>
              <span *ngSwitchCase="'submit'">Submit Data</span>
              <span *ngSwitchCase="'view'">View Data</span>
              <span *ngSwitchDefault></span>
            </h5>
          </div>
          <div class="card-body">
            <form
              [formGroup]="sensorForm"
              (ngSubmit)="onRegisterSensor()"
              *ngIf="mode === 'register'"
            >
              <div class="mb-3">
                <label for="sensorType" class="form-label">Sensor Type</label
                ><select
                  class="form-select"
                  id="sensorType"
                  formControlName="type"
                  required
                >
                  >
                  <option value="">Select sensor type</option>
                  <option value="WaterQuality">Water Quality</option>
                  <option value="WaterQuantity">Water Quantity</option>
                  <option value="WaterPressure">Water Pressure</option>
                  <option value="WaterTemperature">Water Temperature</option>
                  <option value="WaterPH">Water pH</option>
                  <option value="WaterTurbidity">Water Turbidity</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="sensorModel" class="form-label">Sensor Model</label
                ><input
                  type="text"
                  class="form-control"
                  id="sensorModel"
                  formControlName="model"
                />
              </div>
              <div class="mb-3">
                <label for="locationLatitude" class="form-label"
                  >Location Latitude</label
                ><input
                  type="text"
                  class="form-control"
                  id="locationLatitude"
                  placeholder="e.g. 40.7128"
                  formControlName="latitude"
                />
              </div>
              <div class="mb-3">
                <label for="locationLongitude" class="form-label"
                  >Location Longitude</label
                ><input
                  type="text"
                  class="form-control"
                  id="locationLongitude"
                  placeholder="e.g. -74.0060"
                  formControlName="longitude"
                />
              </div>
              <div class="mb-3">
                <label for="locationDescription" class="form-label"
                  >Location Description</label
                ><input
                  type="text"
                  class="form-control"
                  id="locationDescription"
                  placeholder="e.g. River North, Downtown"
                  formControlName="description"
                />
              </div>
              <div class="d-grid">
                <button
                  type="submit"
                  class="btn btn-primary"
                  [disabled]="loading"
                >
                  <ng-container *ngIf="!loading; else loadingTpl"
                    >Register Sensor</ng-container
                  >
                  <ng-template #loadingTpl>
                    <i class="fas fa-spinner fa-spin"></i> Registering...
                  </ng-template>
                </button>
              </div>
              <!-- <div *ngIf="transactionResult" class="mt-3">
                <div *ngIf="transactionResult.transactionHash; else errorTpl">
                  <strong>Transaction Hash:</strong>
                  <a
                    [href]="getTxUrl(transactionResult.transactionHash)"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    {{ transactionResult.transactionHash }}
                  </a>
                  <br />
                  <small>Height: {{ transactionResult.height }}</small>
                  <br />
                  <small>Gas Used: {{ transactionResult.gasUsed }}</small>
                </div>
                <ng-template #errorTpl>
                  <div class="text-danger">
                    <strong>Error:</strong> {{ transactionError }}
                  </div>
                </ng-template>
              </div> -->
            </form>
            <form *ngIf="mode === 'submit'">
              <div class="mb-3">
                <label for="sensorType" class="form-label">Sensor Type</label
                ><select class="form-select" id="sensorType" required="">
                  <option value="">Select sensor type</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="sensorModel" class="form-label">Sensor Model</label
                ><input
                  type="text"
                  class="form-control"
                  id="sensorModel"
                  required=""
                />
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                  Submit Sensor Data
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5 class="mb-0">Recommended Sensors</h5>
          </div>
          <div class="card-body">
            <div class="list-group"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
